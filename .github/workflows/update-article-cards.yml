name: Update fucksponsors daily

on:
  workflow_dispatch:
  # Reconcile even if a push event was suppressed, dropped, or its job failed.
  # The configuration job still skips the writer while the flag is false.
  schedule:
    - cron: '43 5 * * *'

permissions:
  contents: read

# Coalesce queued events: every run fetches current main again on each attempt.
# Keep the active writer; periodic catch-up does not depend on a push event.
concurrency:
  group: publish-optional-article-cards
  cancel-in-progress: false

jobs:
  configuration:
    if: github.ref == 'refs/heads/main' && github.repository == 'JunjoSick/filtershosting'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      enabled: ${{ steps.config.outputs.enabled }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - id: config
        run: |
          enabled=$(node -e 'const c = require("./config/article-cards-automation.json"); if (typeof c.enabled !== "boolean") process.exit(1); console.log(c.enabled);')
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"

  publish:
    needs: configuration
    if: needs.configuration.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Temporary permission for this job only, never a PAT or repository setting.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Build the latest main when this serialized job starts, not an old event.
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Reconcile from fresh main with bounded retries
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/publish-article-cards.mjs
